name = "opalheaven-dashboard"
main = "_worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Fichiers statiques du dashboard (HTML, CSS, JS, textures, catalogues)
[assets]
directory = "./public"
binding = "ASSETS"

# Base de données clé-valeur Cloudflare KV
[[kv_namespaces]]
binding = "OPAL_CONTENT"
id = "opal_content_kv"
